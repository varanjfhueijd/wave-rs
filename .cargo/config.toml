# Config machine-locale : la toolchain windows-gnu de rustup n'embarque pas
# de dlltool fonctionnel. On pointe rustc vers le dlltool de WinLibs GCC
# (installé via winget, présent aussi dans le PATH utilisateur).
[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C",
    "dlltool=C:\\Users\\tourh\\AppData\\Local\\Microsoft\\WinGet\\Packages\\BrechtSanders.WinLibs.POSIX.UCRT_Microsoft.Winget.Source_8wekyb3d8bbwe\\mingw64\\bin\\dlltool.exe",
]
