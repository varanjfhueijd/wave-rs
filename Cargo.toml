[workspace]
resolver = "2"
members = [
    "crates/wave-core",
    "crates/wave-wave",
    "crates/wave-orange",
    "crates/wave-mtn",
    "crates/wave-moov",
    "cli",
    "tests",
    "wave-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/varanjfhueijd/wave-r"
description = "SDK Rust unifié pour les APIs de paiement mobile en Afrique de l'Ouest"
keywords = ["payment", "mobile-money", "africa", "fintech", "wave"]
categories = ["api-bindings", "finance"]

[workspace.dependencies]
# Crates internes
wave-core = { path = "crates/wave-core" }
wave-wave = { path = "crates/wave-wave" }
wave-orange = { path = "crates/wave-orange" }
wave-mtn = { path = "crates/wave-mtn" }
wave-moov = { path = "crates/wave-moov" }

# Runtime & HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Sérialisation & erreurs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Traits async
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }
comfy-table = "7"

# Logs structurés
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Validation E.164
phonenumber = "0.3"

# Tests
wiremock = "0.6"
mockall = "0.13"
