[package]
name = "wave-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI wave — teste le SDK wave-rs en terminal"

[[bin]]
name = "wave"
path = "src/main.rs"

# Exemples d'usage du SDK (dossier examples/ à la racine du workspace).
[[example]]
name = "send_payment"
path = "../examples/send_payment.rs"

[[example]]
name = "check_balance"
path = "../examples/check_balance.rs"

[[example]]
name = "list_transactions"
path = "../examples/list_transactions.rs"

[dependencies]
wave-core = { workspace = true }
wave-wave = { workspace = true }
wave-orange = { workspace = true }
wave-mtn = { workspace = true }
wave-moov = { workspace = true }
clap = { workspace = true }
comfy-table = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
